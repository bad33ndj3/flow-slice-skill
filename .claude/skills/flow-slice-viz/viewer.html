<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive C4 viewer for flow-slice traces.">
<title>flow-slice-viz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2313191d'/><path d='M8 10h12m-4-4 5 4-5 4M24 22H12m4-4-5 4 5 4' fill='none' stroke='%2374d3ae' stroke-width='3'/></svg>">
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<style>
  :root { color-scheme: dark; --canvas:#0c1114; --panel:#13191d; --raised:#182126; --line:#29343a; --text:#e8eeeb; --muted:#86948f; --accent:#74d3ae; --danger:#f06a6a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; }
  body { font-family:"Avenir Next","Segoe UI",sans-serif; background:var(--canvas); color:var(--text); }
  button,input { font:inherit; }
  #toolbar { position:fixed; inset:0 0 auto; height:68px; display:grid; grid-template-columns:auto auto auto minmax(12rem,1fr) auto; align-items:center; gap:16px; padding:0 22px; background:rgba(19,25,29,.94); border-bottom:1px solid var(--line); z-index:10; }
  h1 { margin:0; color:var(--accent); font-size:14px; letter-spacing:-.02em; }
  #crumbs { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#c4cfca; font-size:12px; font-weight:600; }
  #topic { color:var(--muted); font-weight:400; }
  button,#share,#file::file-selector-button { min-height:34px; padding:7px 11px; color:var(--text); background:var(--raised); border:1px solid #34434a; border-radius:7px; cursor:pointer; text-decoration:none; font-size:11px; font-weight:600; }
  button:disabled,#share[aria-disabled="true"] { opacity:.35; cursor:default; }
  button:focus-visible,#share:focus-visible,#file:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  #file { width:108px; color:transparent; font-size:0; }
  #cy { position:fixed; inset:68px 0 0; background-color:var(--canvas); background-image:radial-gradient(circle at 50% 18%,rgba(75,119,112,.14),transparent 34%),linear-gradient(rgba(111,136,130,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(111,136,130,.035) 1px,transparent 1px); background-size:auto,32px 32px,32px 32px; }
  #empty { position:fixed; inset:68px 0 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--muted); font-size:13px; }
  #empty strong { color:var(--text); font-size:17px; }
  #empty.error strong { color:var(--danger); }
  #tooltip { position:fixed; display:none; max-width:min(460px,calc(100vw - 32px)); overflow:hidden; padding:11px 13px; background:rgba(24,33,38,.97); border:1px solid #3a4a51; border-radius:10px; box-shadow:0 18px 50px rgba(0,5,8,.4); font:11px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace; pointer-events:none; z-index:20; }
  #tooltip .row { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #tooltip .label { display:inline-block; min-width:72px; margin-right:8px; color:var(--muted); }
  .unresolved { color:var(--danger); }
  #legend { position:fixed; right:20px; bottom:20px; display:none; max-width:360px; padding:12px 14px; background:rgba(19,25,29,.94); border:1px solid var(--line); border-radius:10px; color:#c4cfca; font-size:11px; line-height:1.45; z-index:10; }
  #legend .title { margin-bottom:6px; color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  #legend .row { display:flex; align-items:center; gap:9px; margin:5px 0; }
  .swatch { width:16px; height:3px; border-radius:2px; }
  .swatch.dashed { height:2px; background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important; }
  #status { position:fixed; left:50%; bottom:24px; display:none; transform:translateX(-50%); padding:8px 12px; background:var(--accent); color:#0c1114; border-radius:7px; font-size:11px; font-weight:700; z-index:30; }
  @media(max-width:760px) { #toolbar { grid-template-columns:auto auto auto 1fr; gap:10px; padding:0 12px; } #file { display:none; } #topic { display:none; } }
</style>
</head>
<body>
<div id="toolbar">
  <h1>flow-slice-viz</h1>
  <button id="back" disabled>&larr; Back</button>
  <a id="share" role="button" aria-disabled="true" target="_blank" rel="noopener">Share</a>
  <span id="crumbs"></span>
  <input type="file" id="file" aria-label="Open a v2 TOON flow slice" accept=".toon,text/plain">
</div>
<div id="empty"><strong>Map the path through your system</strong><span>Open a v2 .toon flow slice.</span></div>
<div id="cy"></div><div id="tooltip"></div><div id="legend"></div><div id="status" role="status" aria-live="polite"></div>
<script>
const SCHEMAS = {
  software_system:['id','name'], containers:['id','name','kind'], external_systems:['id','name'],
  relationships:['id','from','to','transport','contract','confirmed','via','evidence'],
  components:['id','container','name'],
  hops:['id','path','container','component','caller','callee','file','line','confirmed','via','outcome','relationship'],
};
const TRIGGERS = new Set(['grpc','graphql','nats-consumer','cron','http','callback']);
const COLORS = { http:'#63a6d9', grpc:'#63a6d9', event:'#bd8ae6', database:'#d9a45c', unknown:'#f06a6a' };
const PATH_COLORS = ['#d98c3d','#3dd9a0','#d93d8c','#8c3dd9','#d9d13d','#3da8d9'];
const pathColors = new Map();
let slice=null, cy=null, level='c2', containerId=null, componentId=null;
const byId=(rows,id)=>rows.find(row=>row.id===id);
const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const pathColor=path=>{ if(!pathColors.has(path)) pathColors.set(path,PATH_COLORS[pathColors.size%PATH_COLORS.length]); return pathColors.get(path); };

function splitRow(row,line) {
  const cells=[]; let current='',quoted=false;
  for(const char of row) { if(char==='"') quoted=!quoted; else if(char===','&&!quoted){cells.push(current);current='';} else current+=char; }
  if(quoted) throw new Error(`Unmatched quote on line ${line}.`); cells.push(current); return cells;
}
function coerce(value) { return value==='true'?true:value==='false'?false:value; }
function parseToon(text) {
  if(!text.trim()) throw new Error('The TOON file is empty.');
  if(/^services\[|^edges\[/m.test(text)) throw new Error('V1 traces are unsupported. Run setup-flow-slice and retrace as v2.');
  const data={},lines=text.replace(/\r\n/g,'\n').split('\n'); let i=0;
  while(i<lines.length) {
    const line=lines[i]; if(!line.trim()||/^\s*#/.test(line)){i++;continue;}
    const header=line.match(/^(\w+)\[(\d+)\]\{([^}]*)\}:\s*$/);
    if(header) {
      const [,key,countText,fieldText]=header, fields=fieldText.split(',').map(value=>value.trim());
      if(!SCHEMAS[key]) throw new Error(`Unknown table "${key}" on line ${i+1}.`);
      if(data[key]) throw new Error(`Duplicate table "${key}" on line ${i+1}.`);
      if(fields.join(',')!==SCHEMAS[key].join(',')) throw new Error(`Wrong columns for ${key} on line ${i+1}.`);
      data[key]=[];
      for(let row=0;row<Number(countText);row++) { i++; if(!lines[i]?.startsWith('  ')) throw new Error(`Missing ${key} row on line ${i+1}.`); const cells=splitRow(lines[i].trim(),i+1); if(cells.length!==fields.length||cells.some(cell=>cell==='')) throw new Error(`Invalid ${key} row on line ${i+1}.`); data[key].push(Object.fromEntries(fields.map((field,index)=>[field,coerce(cells[index])]))); }
      i++; continue;
    }
    const scalar=line.match(/^(version|topic):\s(.+)$/); if(!scalar) throw new Error(`Invalid top-level line ${i+1}.`);
    if(data[scalar[1]]!==undefined) throw new Error(`Duplicate ${scalar[1]} on line ${i+1}.`); data[scalar[1]]=scalar[2]; i++;
  }
  validate(data); return data;
}
function validate(data) {
  if(data.version!=='2') throw new Error('Version must be 2. Run setup-flow-slice and retrace.');
  if(!data.topic) throw new Error('Missing topic.');
  Object.keys(SCHEMAS).forEach(key=>{if(!Array.isArray(data[key])) throw new Error(`Missing ${key} table.`);});
  if(data.software_system.length!==1) throw new Error('software_system must contain exactly one row.');
  const containers=new Map(data.containers.map(row=>[row.id,row])), externals=new Set(data.external_systems.map(row=>row.id));
  const components=new Map(data.components.map(row=>[row.id,row])), relationships=new Map(data.relationships.map(row=>[row.id,row]));
  const ids=[...data.software_system,...data.containers,...data.external_systems,...data.relationships,...data.components,...data.hops].map(row=>row.id);
  if(new Set(ids).size!==ids.length) throw new Error('IDs must be globally unique.');
  data.relationships.forEach(row=>{if(!(containers.has(row.from)||externals.has(row.from))||!(containers.has(row.to)||externals.has(row.to))) throw new Error(`Relationship ${row.id} has an unknown endpoint.`);if(!containers.has(row.from)&&!containers.has(row.to))throw new Error(`Relationship ${row.id} must touch a container.`);});
  data.components.forEach(row=>{if(containers.get(row.container)?.kind!=='application') throw new Error(`Component ${row.id} has an invalid parent.`);});
  data.hops.forEach(row=>{const match=row.path.match(/^.+ \(([^)]+)\)$/); if(!match||!TRIGGERS.has(match[1])) throw new Error(`Hop ${row.id} has an invalid entrypoint suffix.`); if(components.get(row.component)?.container!==row.container) throw new Error(`Hop ${row.id} crosses containers.`); if(row.relationship!=='-'&&!relationships.has(row.relationship)) throw new Error(`Hop ${row.id} references an unknown relationship.`);});
}
function encode(text) { const bytes=new TextEncoder().encode(text); let binary=''; bytes.forEach(byte=>binary+=String.fromCharCode(byte)); return btoa(binary); }
function decode(text) { const binary=atob(text); return new TextDecoder().decode(Uint8Array.from(binary,char=>char.charCodeAt(0))); }
function load(text) {
  try { slice=parseToon(text); } catch(error) { showError(error.message); return; }
  level='c2'; containerId=null; componentId=null;
  share.href=`https://bad33ndj3.github.io/flow-slice-skill/#b64=${encode(text)}`; share.removeAttribute('aria-disabled'); render();
}
function showError(message) { if(cy){cy.destroy();cy=null;} slice=null; share.removeAttribute('href'); share.setAttribute('aria-disabled','true'); empty.classList.add('error'); empty.replaceChildren(Object.assign(document.createElement('strong'),{textContent:'Could not open flow slice'}),Object.assign(document.createElement('span'),{textContent:message})); empty.style.display='flex'; }

file.addEventListener('change',event=>{const selected=event.target.files[0];if(!selected)return;const reader=new FileReader();reader.onload=()=>load(reader.result);reader.onerror=()=>showError(`Could not read ${selected.name}.`);reader.readAsText(selected);});
const hash=location.hash.slice(1); if(hash.startsWith('b64=')){try{load(decode(hash.slice(4)));}catch(error){showError(`Could not decode URL data: ${error.message}`);}}
back.addEventListener('click',()=>{if(level==='c4'){level='c3';componentId=null;}else if(level==='c3'){level='c2';containerId=null;}render();});

function c2Elements() {
  const nodes=[...slice.containers.map(row=>({data:{id:row.id,label:row.name,nodeType:'container',kind:row.kind,drill:row.kind==='application'}})),...slice.external_systems.map(row=>({data:{id:row.id,label:row.name,nodeType:'external-system',kind:'external-system',drill:false}}))];
  const edges=slice.relationships.map(row=>({data:{...row,source:row.from,target:row.to,label:row.transport,kind:row.transport}})); return [...nodes,...edges];
}
function c3Elements() { return slice.components.filter(row=>row.container===containerId).map(row=>({data:{id:row.id,label:row.name,nodeType:'component',kind:'component',drill:true}})); }
function c4Elements() {
  const hops=slice.hops.filter(row=>row.component===componentId), symbols=new Map();
  hops.forEach(hop=>[hop.caller,hop.callee].forEach(symbol=>{if(!symbols.has(symbol))symbols.set(symbol,{data:{id:`symbol:${symbol}`,label:symbol.split('.').pop(),symbol,nodeType:'code',kind:'code'}});}));
  const edges=hops.map(hop=>({data:{...hop,source:`symbol:${hop.caller}`,target:`symbol:${hop.callee}`,label:hop.outcome==='-'?'':hop.outcome,evidence:`${hop.file}:${hop.line}`,kind:'hop',pathColor:pathColor(hop.path)}}));
  return [...symbols.values(),...edges];
}
function render() {
  if(!slice||typeof cytoscape!=='function'){if(slice)showError('The graph library could not be loaded.');return;}
  empty.classList.remove('error'); empty.style.display='none'; tooltip.style.display='none'; back.disabled=level==='c2';
  const system=slice.software_system[0].name, container=containerId&&byId(slice.containers,containerId), component=componentId&&byId(slice.components,componentId);
  crumbs.innerHTML=[`<strong>${esc(system)}</strong>`,level==='c2'?'Containers (C2)':esc(container.name),level==='c3'?'Components (C3)':null,level==='c4'?esc(component.name):null,level==='c4'?'Code (C4)':null].filter(Boolean).join(' / ')+` <span id="topic">— ${esc(slice.topic)}</span>`;
  if(cy)cy.destroy(); cy=cytoscape({container:document.getElementById('cy'),elements:level==='c2'?c2Elements():level==='c3'?c3Elements():c4Elements(),style:styles(),layout:{name:'breadthfirst',directed:true,spacingFactor:1.08,padding:48}}); renderLegend();
  cy.on('tap','node',event=>{const data=event.target.data();if(!data.drill)return;if(level==='c2'){containerId=data.id;level='c3';}else if(level==='c3'){componentId=data.id;level='c4';}render();});
  cy.on('mouseover','node, edge',showTooltip); cy.on('mousemove',event=>positionTooltip(event.originalEvent)); cy.on('mouseout','node, edge',()=>{tooltip.style.display='none';document.getElementById('cy').style.cursor='';});
  cy.on('mouseover','edge',event=>{if(event.target.data('confirmed')!==false)document.getElementById('cy').style.cursor='copy';}); cy.on('tap','edge',event=>copyEvidence(event.target.data()));
}
function renderLegend() {
  if(level==='c2') { const kinds=[...new Set(slice.relationships.map(row=>row.transport))]; legend.innerHTML=`<div class="title">C2 relationships</div>${kinds.map(kind=>`<div class="row"><span class="swatch${kind==='event'?' dashed':''}" style="color:${COLORS[kind]};background:${COLORS[kind]}"></span>${esc(kind)}</div>`).join('')}`; legend.style.display=kinds.length?'block':'none'; return; }
  if(level==='c3') { legend.innerHTML='<div class="title">Components (C3)</div><div class="row">Select a component to inspect its code.</div>'; legend.style.display='block'; return; }
  const paths=[...new Set(slice.hops.filter(row=>row.component===componentId).map(row=>row.path))]; legend.innerHTML=`<div class="title">Code paths (C4)</div>${paths.map(path=>`<div class="row"><span class="swatch" style="background:${pathColor(path)}"></span>${esc(path)}</div>`).join('')}`; legend.style.display=paths.length?'block':'none';
}
function styles() { return [
  {selector:'node',style:{'background-color':'#18252a','label':'data(label)','color':'#e8eeeb','font-family':'Avenir Next, Segoe UI, sans-serif','font-size':13,'font-weight':600,'text-valign':'center','text-halign':'center','shape':'round-rectangle','width':node=>Math.max(110,Math.min(230,node.data('label').length*7.5+32)),'height':42,'padding':10,'border-width':1,'border-color':'#48636a'}},
  {selector:'node[kind="application"]',style:{'background-color':'#1b302d','border-color':'#5c9f8a','border-width':2}},
  {selector:'node[kind="data-store"]',style:{'shape':'barrel','background-color':'#30291b','border-color':'#b58b52'}},
  {selector:'node[kind="external-system"]',style:{'shape':'rectangle','background-color':'#2a2230','border-color':'#9d72b5','border-style':'dashed'}},
  {selector:'node[kind="component"]',style:{'background-color':'#1c2d35','border-color':'#6799ad'}},
  {selector:'edge',style:{'width':2,'line-color':'#526068','target-arrow-color':'#526068','target-arrow-shape':'triangle','curve-style':'bezier','label':'data(label)','font-size':11,'font-weight':600,'color':'#b8c4bf','text-background-color':'#0c1114','text-background-opacity':.9,'text-background-padding':4}},
  ...Object.entries(COLORS).map(([kind,color])=>({selector:`edge[kind="${kind}"]`,style:{'line-color':color,'target-arrow-color':color,'line-style':kind==='event'?'dashed':'solid'}})),
  {selector:'edge[kind="hop"]',style:{'line-color':'data(pathColor)','target-arrow-color':'data(pathColor)'}},
  {selector:'edge[!confirmed]',style:{'line-style':'dashed','line-color':'#f06a6a','target-arrow-color':'#f06a6a'}},
]; }
function showTooltip(event) {
  const data=event.target.data(); let rows=[];
  if(event.target.isNode()) rows=[[data.nodeType.replace('-', ' '),data.symbol||data.label],[data.drill?'click':'',data.drill?'drill down':'']];
  else rows=[['via',data.confirmed===false?'<span class="unresolved">unresolved</span>':esc(data.via)],['evidence',esc(data.evidence||'-')],['contract',esc(data.contract||'-')],['path',esc(data.path||'-')],['outcome',esc(data.outcome||'-')],['relationship',esc(data.relationship||data.id||'-')],['click',data.confirmed===false?'':'copy evidence']];
  tooltip.innerHTML=rows.filter(row=>row[0]&&row[1]&&row[1]!=='-').map(row=>`<div class="row"><span class="label">${esc(row[0])}</span>${row[1]}</div>`).join(''); tooltip.style.display='block';
}
function positionTooltip(event) { if(!event)return; tooltip.style.left=`${event.clientX+14}px`;tooltip.style.top=`${event.clientY+14}px`; }
async function copyEvidence(data) { if(data.confirmed===false||!data.evidence)return; try{await navigator.clipboard.writeText(data.evidence);showStatus('Evidence copied');}catch{showStatus('Could not copy evidence');} }
function showStatus(message) { status.textContent=message;status.style.display='block';clearTimeout(showStatus.timer);showStatus.timer=setTimeout(()=>status.style.display='none',1600); }
</script>
</body>
</html>
