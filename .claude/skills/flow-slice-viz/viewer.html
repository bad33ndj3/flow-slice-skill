<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive service and call-flow viewer for flow-slice traces.">
<title>flow-slice-viz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%2313191d'/><path d='M17 20h17M30 14l6 6-6 6M47 44H30M34 38l-6 6 6 6' fill='none' stroke='%2374d3ae' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --canvas: #0c1114;
    --panel: #13191d;
    --panel-raised: #182126;
    --line: #29343a;
    --text: #e8eeeb;
    --muted: #86948f;
    --accent: #74d3ae;
    --danger: #f06a6a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: "Avenir Next", "Segoe UI", sans-serif; background: var(--canvas); color: var(--text); }
  button, input { font: inherit; }
  #toolbar {
    position: fixed; inset: 0 0 auto 0; height: 68px; display: grid;
    grid-template-columns: auto auto auto minmax(0, auto) minmax(12rem, 1fr) auto;
    align-items: center; gap: 16px; padding: 0 22px;
    background: rgba(19, 25, 29, 0.92); border-bottom: 1px solid var(--line);
    box-shadow: 0 10px 40px rgba(0, 7, 10, 0.22); backdrop-filter: blur(18px); z-index: 10;
  }
  #toolbar h1 { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
  #toolbar h1::before { content: ""; width: 11px; height: 11px; border: 2px solid var(--accent); border-radius: 3px; box-shadow: 5px 5px 0 -2px var(--panel), 5px 5px 0 0 rgba(116, 211, 174, 0.38); transform: rotate(45deg); }
  #toolbar .topic { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }
  #whereLabel { padding-left: 16px; border-left: 1px solid var(--line); font-size: 12px; font-weight: 600; color: #c4cfca; white-space: nowrap; }
  #toolbar button, #shareLink, #fileInput::file-selector-button {
    min-height: 34px; background: var(--panel-raised); color: var(--text); border: 1px solid #34434a;
    border-radius: 7px; padding: 7px 11px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
    cursor: pointer; text-decoration: none; transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
  }
  #toolbar button:hover:not(:disabled), #shareLink:hover:not([aria-disabled="true"]), #fileInput:hover::file-selector-button { background: #202c31; border-color: #496068; transform: translateY(-1px); }
  #toolbar button:active:not(:disabled), #shareLink:active:not([aria-disabled="true"]), #fileInput:active::file-selector-button { transform: translateY(0); }
  #toolbar button:focus-visible, #shareLink:focus-visible, #fileInput:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #toolbar button:disabled, #shareLink[aria-disabled="true"] { opacity: 0.35; cursor: default; }
  #fileInput { width: 108px; color: transparent; font-size: 0; }
  #fileInput::file-selector-button { margin: 0; color: var(--text); }
  #cy {
    position: fixed; top: 68px; left: 0; right: 0; bottom: 0;
    background-color: var(--canvas);
    background-image: radial-gradient(circle at 50% 18%, rgba(75, 119, 112, 0.14), transparent 34%), linear-gradient(rgba(111, 136, 130, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(111, 136, 130, 0.035) 1px, transparent 1px);
    background-size: auto, 32px 32px, 32px 32px;
  }
  #empty { position: fixed; top: 68px; inset-inline: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; }
  #empty::before { content: "↳"; display: grid; place-items: center; width: 54px; height: 54px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 15px; background: var(--panel); color: var(--accent); font: 500 24px/1 ui-monospace, monospace; box-shadow: 0 18px 50px rgba(0, 5, 8, 0.28); }
  #empty strong { color: var(--text); font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  #tooltip { position: fixed; display: none; max-width: min(420px, calc(100vw - 32px)); overflow: hidden; background: rgba(24, 33, 38, 0.96); border: 1px solid #3a4a51; border-radius: 10px; padding: 11px 13px; box-shadow: 0 18px 50px rgba(0, 5, 8, 0.4); backdrop-filter: blur(16px); font: 11px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; pointer-events: none; z-index: 20; }
  #tooltip .row { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tooltip .label { display: inline-block; min-width: 58px; color: var(--muted); margin-right: 8px; }
  #tooltip .unresolved { color: var(--danger); }
  #copyStatus { position: fixed; left: 50%; bottom: 24px; display: none; transform: translateX(-50%); background: var(--accent); color: #0c1114; border-radius: 7px; padding: 8px 12px; font-size: 11px; font-weight: 700; z-index: 30; }
  #legend { position: fixed; right: 20px; bottom: 20px; max-width: 360px; background: rgba(19, 25, 29, 0.92); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: 0 14px 40px rgba(0, 5, 8, 0.25); backdrop-filter: blur(14px); font-size: 11px; line-height: 1.45; color: #c4cfca; z-index: 10; display: none; }
  #legend .section + .section { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  #legend .title { margin-bottom: 6px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  #legend .row { display: flex; align-items: center; gap: 9px; margin: 5px 0; }
  #legend .swatch { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
  #legend .swatch.dashed { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px); height: 2px; }
  #legend .badge { flex: 0 0 auto; border: 1px solid #5c9f8a; border-radius: 4px; padding: 2px 6px; background: #1b302d; color: #a9dfca; font: 700 8px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 0.03em; }
  #legend .outcome { align-items: flex-start; }
  #legend .outcome::before { content: "→"; flex: 0 0 17px; color: var(--accent); font-weight: 700; text-align: center; }
  #legend .outcome strong { display: block; color: var(--text); font-weight: 600; }
  #legend .outcome small { display: block; max-width: 290px; margin-top: 1px; color: var(--muted); font-size: 11px; line-height: 1.45; }
  #legend code { color: #a8b5af; white-space: nowrap; font: 9px ui-monospace, SFMono-Regular, Consolas, monospace; }
  @media (max-width: 760px) {
    #toolbar { grid-template-columns: auto auto auto 1fr auto; gap: 10px; padding: 0 12px; }
    #toolbar .topic { display: none; }
    #whereLabel { overflow: hidden; text-overflow: ellipsis; }
  }
</style>
</head>
<body>
<div id="toolbar">
  <h1>flow-slice-viz</h1>
  <button id="backBtn" disabled>&larr; level 1</button>
  <a id="shareLink" role="button" aria-disabled="true" target="_blank" rel="noopener">Share</a>
  <span id="whereLabel"></span>
  <span class="topic" id="topicLabel"></span>
  <input type="file" id="fileInput" aria-label="Open a TOON flow slice" accept=".toon,text/plain">
</div>
<div id="empty"><strong>Map the path through your system</strong><span>Open a .toon flow slice to explore services and calls.</span></div>
<div id="cy"></div>
<div id="tooltip"></div>
<div id="legend"></div>
<div id="copyStatus" role="status" aria-live="polite"></div>

<script>
// --- TOON subset parser: scalar "key: value" lines + tabular arrays
// ("name[N]{f1,f2}:" header followed by N comma-separated indented rows).
// See flow-slice-viz/SKILL.md for the schema this expects.
function parseToon(text) {
  const lines = text.replace(/\r\n/g, '\n').split('\n');
  const result = {};
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim() === '' || /^\s*#/.test(line)) { i++; continue; }
    const header = line.match(/^(\w+)\[(\d+)\]\{([^}]*)\}:\s*$/);
    if (header) {
      const key = header[1];
      const count = parseInt(header[2], 10);
      const fields = header[3].split(',').map(s => s.trim());
      const rows = [];
      for (let r = 0; r < count; r++) {
        i++;
        const cells = splitRow((lines[i] || '').trim());
        const obj = {};
        fields.forEach((f, idx) => { obj[f] = coerce(cells[idx]); });
        rows.push(obj);
      }
      result[key] = rows;
      i++;
      continue;
    }
    const scalar = line.match(/^(\w+):\s(.*)$/);
    if (scalar) { result[scalar[1]] = scalar[2]; i++; continue; }
    i++;
  }
  return result;
}

function splitRow(row) {
  const cells = [];
  let cur = '', inQuotes = false;
  for (const ch of row) {
    if (ch === '"') { inQuotes = !inQuotes; continue; }
    if (ch === ',' && !inQuotes) { cells.push(cur); cur = ''; continue; }
    cur += ch;
  }
  cells.push(cur);
  return cells;
}

function coerce(v) {
  if (v === 'true') return true;
  if (v === 'false') return false;
  return v;
}

// --- App state
let slice = null;
let level = 1; // 1 = services, 2 = hops for `currentService`
let currentService = null;
let cy = null;

const cyEl = document.getElementById('cy');
const emptyEl = document.getElementById('empty');
const tooltipEl = document.getElementById('tooltip');
const backBtn = document.getElementById('backBtn');
const shareLink = document.getElementById('shareLink');
const topicLabel = document.getElementById('topicLabel');
const whereLabel = document.getElementById('whereLabel');
const legendEl = document.getElementById('legend');
const copyStatusEl = document.getElementById('copyStatus');

const PATH_COLORS = ['#d98c3d', '#3dd9a0', '#d93d8c', '#8c3dd9', '#d9d13d', '#3da8d9'];
const pathColor = (() => {
  const assigned = new Map();
  return (path) => {
    if (!assigned.has(path)) assigned.set(path, PATH_COLORS[assigned.size % PATH_COLORS.length]);
    return assigned.get(path);
  };
})();

// `path` names follow the convention "<name> (<trigger>)" — parse the trigger for an
// entry-node shape. A name that doesn't fit the convention just gets no shape/icon,
// never an error.
const TRIGGER_LABELS = {
  grpc: 'gRPC request', graphql: 'GraphQL request',
  'nats-consumer': 'NATS consumer', cron: 'Scheduled job', http: 'HTTP request',
};
const OUTCOMES = {
  'db-write': { label: 'saves data', title: 'Saves data', detail: 'This path ends here after writing to the database.' },
  'db-read': { label: 'reads data', title: 'Reads data', detail: 'This path ends here after reading from the database.' },
  return: { label: 'returns', title: 'Returns to caller', detail: 'This path ends by returning a result to its caller.' },
};
function parseTrigger(path) {
  const m = /\(([^)]+)\)\s*$/.exec(path || '');
  if (!m) return null;
  const trigger = m[1].toLowerCase().trim().replace(/\s+/g, '-');
  return TRIGGER_LABELS[trigger] ? trigger : null;
}

function shortSymbol(symbol) {
  return symbol.split('.').pop();
}

function outcomeInfo(outcome) {
  return OUTCOMES[outcome] || {
    label: outcome, title: outcome, detail: 'This is the final recorded step in the traced path.',
  };
}

function loadSlice(text) {
  slice = parseToon(text);
  slice.services = slice.services || [];
  slice.edges = slice.edges || [];
  slice.hops = slice.hops || [];
  topicLabel.textContent = slice.topic || '';
  level = 1;
  currentService = null;
  shareLink.href = `https://bad33ndj3.github.io/flow-slice-skill/#b64=${encodeBase64(text)}`;
  shareLink.removeAttribute('aria-disabled');
  render();
}

function encodeBase64(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = '';
  bytes.forEach(byte => { binary += String.fromCharCode(byte); });
  return btoa(binary);
}

function decodeBase64(encoded) {
  const binary = atob(encoded);
  return new TextDecoder().decode(Uint8Array.from(binary, char => char.charCodeAt(0)));
}

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => loadSlice(reader.result);
  reader.readAsText(file);
});

// #b64=<base64-encoded TOON> — primary auto-load path; works from file:// with no server.
// ?file=<server-root-relative path> — fallback when served over http(s).
const hashParam = location.hash.slice(1);
if (hashParam.startsWith('b64=')) {
  try {
    loadSlice(decodeBase64(hashParam.slice(4)));
  } catch (err) {
    emptyEl.textContent = `Could not decode inline data: ${err}. Use the file picker instead.`;
  }
} else {
  const preloadPath = new URLSearchParams(location.search).get('file');
  if (preloadPath) {
    fetch(preloadPath)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(loadSlice)
      .catch(err => { emptyEl.textContent = `Could not load "${preloadPath}": ${err}. Use the file picker instead.`; });
  }
}

backBtn.addEventListener('click', () => {
  level = 1;
  currentService = null;
  render();
});

function render() {
  if (!slice) return;
  emptyEl.style.display = 'none';
  backBtn.disabled = level === 1;
  whereLabel.textContent = level === 1 ? 'level 1 - services' : `level 2 - ${currentService}`;

  const elements = level === 1 ? level1Elements() : level2Elements(currentService);
  renderLegend();

  if (cy) cy.destroy();
  cy = cytoscape({
    container: cyEl,
    elements,
    style: cyStyle(),
    layout: { name: 'breadthfirst', directed: true, spacingFactor: 1.05, padding: 48 },
  });
  addTriggerBadges();

  if (level === 1) {
    cy.on('tap', 'node', (evt) => {
      currentService = evt.target.id();
      level = 2;
      render();
    });
  }

  cy.on('mouseover', 'node, edge', (evt) => showTooltip(evt));
  cy.on('mouseover', 'edge', (evt) => { if (evt.target.data('confirmed') !== false) cyEl.style.cursor = 'copy'; });
  cy.on('mouseout', 'node, edge', () => { tooltipEl.style.display = 'none'; cyEl.style.cursor = ''; });
  cy.on('mousemove', (evt) => positionTooltip(evt.originalEvent));
  cy.on('tap', 'edge', (evt) => copyFilePath(evt.target.data()));
}

function addTriggerBadges() {
  cy.nodes('[trigger]').forEach(node => {
    const label = TRIGGER_LABELS[node.data('trigger')];
    const width = label.length * 5.2 + 14;
    const position = node.position();
    cy.add({
      data: { id: `badge:${node.id()}`, label, badgeWidth: width, kind: 'trigger-badge' },
      position: { x: position.x - node.width() / 2 + width / 2 + 8, y: position.y - node.height() / 2 },
      locked: true,
    });
  });
}

async function copyFilePath(data) {
  if (data.confirmed === false || !data.evidence) return;
  try {
    try {
      await navigator.clipboard.writeText(data.evidence);
    } catch {
      const input = document.createElement('textarea');
      input.value = data.evidence;
      document.body.appendChild(input);
      input.select();
      const copied = document.execCommand('copy');
      input.remove();
      if (!copied) throw new Error('Copy failed');
    }
    showCopyStatus('Full file path copied');
  } catch {
    showCopyStatus('Could not copy file path');
  }
}

function showCopyStatus(message) {
  copyStatusEl.textContent = message;
  copyStatusEl.style.display = 'block';
  clearTimeout(showCopyStatus.timeout);
  showCopyStatus.timeout = setTimeout(() => { copyStatusEl.style.display = 'none'; }, 1600);
}

function level1Elements() {
  const nodes = slice.services.map(s => ({
    data: { id: s.id, label: s.id, kind: 'service' },
  }));
  const edges = slice.edges.map((e, idx) => ({
    data: {
      id: `e${idx}`, source: e.from, target: e.to,
      label: e.kind, kind: e.kind, confirmed: e.confirmed,
      via: e.via, evidence: e.evidence, contract: e.contract,
    },
  }));
  return [...nodes, ...edges];
}

function level2Elements(service) {
  const hops = slice.hops.filter(h => h.service === service);
  const nodePaths = new Map(); // id -> Set(path) — >1 path means a convergence node

  // Entry node of a path = the `from` that never appears as a `to` within that
  // path's own hops. Scoped per path (not global), so convergence between
  // different paths elsewhere in the graph can't make this ambiguous — see
  // `.scratch/flow-slice-viz/issues/03-outcome-trigger-clarity.md` for why the
  // equivalent per-path *terminal* inference was rejected but entry inference
  // is safe.
  const entryTrigger = new Map(); // id -> trigger
  const byPath = new Map();
  hops.forEach(h => {
    if (!byPath.has(h.path)) byPath.set(h.path, []);
    byPath.get(h.path).push(h);
  });
  byPath.forEach((pathHops, path) => {
    const trigger = parseTrigger(path);
    if (!trigger) return;
    const tos = new Set(pathHops.map(h => h.to));
    const entries = [...new Set(pathHops.map(h => h.from))].filter(id => !tos.has(id));
    if (entries.length === 1) entryTrigger.set(entries[0], trigger);
  });

  hops.forEach(h => {
    [h.from, h.to].forEach(id => {
      if (!nodePaths.has(id)) nodePaths.set(id, new Set());
      nodePaths.get(id).add(h.path);
    });
  });
  // Cytoscape's `[pathColor]` selector matches on key presence, not truthiness — a
  // `pathColor: null` key would still match and render a black border. Omit the key
  // entirely for a convergence node (>1 path) so it falls through to the default style.
  const nodes = [...nodePaths.entries()].map(([id, paths]) => {
    const data = { id, label: shortSymbol(id), symbol: id, kind: 'symbol' };
    if (paths.size === 1) data.pathColor = pathColor([...paths][0]);
    if (entryTrigger.has(id)) data.trigger = entryTrigger.get(id);
    return { data };
  });
  const edges = hops.map((h, idx) => ({
    data: {
      id: `h${idx}`, source: h.from, target: h.to,
      label: h.outcome && h.outcome !== '-' ? outcomeInfo(h.outcome).label : '',
      confirmed: h.confirmed, via: h.via, path: h.path, outcome: h.outcome,
      evidence: `${h.file}:${h.line}`, pathColor: pathColor(h.path),
    },
  }));
  return [...nodes, ...edges];
}

function renderLegend() {
  if (level === 1) {
    const kinds = [...new Set(slice.edges.map(e => e.kind))];
    legendEl.innerHTML = `<div class="section"><div class="title">Connections</div>${kinds.map(k => `
      <div class="row"><span class="swatch${k === 'event' ? ' dashed' : ''}" style="color:${kindColor(k)};background-color:${k === 'event' ? 'transparent' : kindColor(k)}"></span>${k}</div>
    `).join('')}</div>`;
    legendEl.style.display = kinds.length ? 'block' : 'none';
  } else {
    const serviceHops = slice.hops.filter(h => h.service === currentService);
    const paths = [...new Set(serviceHops.map(h => h.path))];
    const triggers = [...new Set(paths.map(parseTrigger).filter(Boolean))];
    const outcomes = [...new Set(serviceHops.map(h => h.outcome).filter(o => o && o !== '-'))];
    legendEl.innerHTML = [
      `<div class="section"><div class="title">Flows</div>${paths.map(p => `<div class="row"><span class="swatch" style="background-color:${pathColor(p)}"></span>${p}</div>`).join('')}</div>`,
      triggers.length ? `<div class="section"><div class="title">Entry points</div>${triggers.map(t => `<div class="row"><span class="badge">${TRIGGER_LABELS[t]}</span><span>starts a flow</span></div>`).join('')}</div>` : '',
      outcomes.length ? `<div class="section"><div class="title">Path endings</div>${outcomes.map(o => { const info = outcomeInfo(o); return `<div class="row outcome"><span><strong>${info.title}</strong><small>${info.detail} <code>${o}</code></small></span></div>`; }).join('')}</div>` : '',
    ].join('');
    legendEl.style.display = (paths.length || triggers.length || outcomes.length) ? 'block' : 'none';
  }
}

function kindColor(kind) {
  return kind === 'event' ? '#bd8ae6' : '#63a6d9';
}

function cyStyle() {
  return [
    { selector: 'node', style: {
      'background-color': '#18252a', 'label': 'data(label)', 'color': '#e8eeeb',
      'font-family': 'Avenir Next, Segoe UI, sans-serif',
      'font-size': 13, 'font-weight': 600, 'text-valign': 'center', 'text-halign': 'center',
      'shape': 'round-rectangle', 'width': (n) => Math.max(110, Math.min(230, n.data('label').length * 7.5 + 32)),
      'height': 42, 'padding': 10,
      'border-width': 1, 'border-color': '#48636a',
    } },
    { selector: 'node[kind = "service"]', style: {
      'background-color': '#1b302d', 'border-color': '#5c9f8a', 'padding': 14,
    } },
    // level 2: node border colored by its path when it belongs to exactly one
    // (a node touched by >1 path is a convergence point — left neutral on purpose).
    { selector: 'node[pathColor]', style: {
      'border-width': 3, 'border-color': 'data(pathColor)',
    } },
    // Level 2 entry nodes keep the standard shape and get a small corner badge.
    { selector: 'node[kind = "trigger-badge"]', style: {
      'background-color': '#1b302d', 'border-width': 1, 'border-color': '#5c9f8a',
      'width': 'data(badgeWidth)', 'height': 16, 'padding': 2, 'label': 'data(label)',
      'color': '#a9dfca', 'font-family': 'ui-monospace, SFMono-Regular, Consolas, monospace',
      'font-size': 8, 'font-weight': 700, 'events': 'no', 'z-index': 999,
    } },
    { selector: 'edge', style: {
      'width': 2, 'line-color': '#526068', 'target-arrow-color': '#526068',
      'target-arrow-shape': 'triangle', 'curve-style': 'bezier',
      'arrow-scale': 0.9, 'label': 'data(label)', 'font-family': 'Avenir Next, Segoe UI, sans-serif',
      'font-size': 11, 'font-weight': 600, 'color': '#b8c4bf', 'text-background-color': '#0c1114',
      'text-background-opacity': 0.9, 'text-background-padding': 4,
    } },
    // level 1: color/style by protocol (kind).
    { selector: 'edge[kind = "grpc"]', style: { 'line-color': '#63a6d9', 'target-arrow-color': '#63a6d9' } },
    { selector: 'edge[kind = "event"]', style: { 'line-style': 'dashed', 'line-color': '#bd8ae6', 'target-arrow-color': '#bd8ae6' } },
    // level 2: color by path (entry point).
    { selector: 'edge[pathColor]', style: { 'line-color': 'data(pathColor)', 'target-arrow-color': 'data(pathColor)' } },
    // Cytoscape boolean data selectors: `[?field]` = true, `[!field]` = false/absent.
    // `[field = false]` is NOT valid and previously matched every edge — every hop
    // rendered as if unresolved regardless of its actual `confirmed` value.
    { selector: 'edge[!confirmed]', style: {
      'line-style': 'dashed', 'line-color': '#f06a6a', 'target-arrow-color': '#f06a6a',
    } },
  ];
}

function showTooltip(evt) {
  const d = evt.target.data();
  let html;
  if (evt.target.isNode()) {
    html = `<div class="row"><span class="label">${d.kind === 'service' ? 'service' : 'symbol'}</span>${d.symbol || d.label}</div>`;
    if (d.trigger) html += `<div class="row"><span class="label">trigger</span>${d.trigger}</div>`;
  } else {
    const confirmed = d.confirmed !== false;
    html = `
      <div class="row"><span class="label">via</span>${confirmed ? d.via : `<span class="unresolved">unresolved</span>`}</div>
      <div class="row"><span class="label">at</span>${d.evidence || '-'}</div>`;
    if (d.contract && d.contract !== '-') {
      html += `<div class="row"><span class="label">contract</span>${d.contract}</div>`;
    }
    if (d.path) {
      html += `<div class="row"><span class="label">path</span>${d.path}</div>`;
    }
    if (d.outcome && d.outcome !== '-') {
      html += `<div class="row"><span class="label">outcome</span>${outcomeInfo(d.outcome).title} (${d.outcome})</div>`;
    }
    if (confirmed && d.evidence) {
      html += `<div class="row"><span class="label">click</span>copy full file path</div>`;
    }
  }
  tooltipEl.innerHTML = html;
  tooltipEl.style.display = 'block';
}

function positionTooltip(mouseEvt) {
  if (!mouseEvt) return;
  tooltipEl.style.left = (mouseEvt.clientX + 14) + 'px';
  tooltipEl.style.top = (mouseEvt.clientY + 14) + 'px';
}
</script>
</body>
</html>
